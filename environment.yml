# Development environment for toughio.
#
#   conda env create -f environment.yml     (or: mamba env create -f ...)
#   conda activate toughio
#   pip install -e . --no-deps               # install THIS checkout, not PyPI
#   pytest
#
# Direct dependencies are pinned to the exact versions this branch was
# tested with (Windows 11, conda-forge, 2026-10-29), so the results can be
# reproduced. Transitive dependencies are resolved by conda and may differ
# slightly between platforms or over time. pyproject.toml remains the
# authority on the supported version ranges.
name: toughio
channels:
  - conda-forge
dependencies:
  - python=3.12.15
  - pip=26.2.1
  # runtime (pyproject.toml)
  - h5py=3.16.0
  - matplotlib=3.10.9
  - meshio=5.3.5
  - numpy=2.5.4
  - pandas=3.0.6
  - psutil=7.2.2
  - pyvista=0.49.1
  - scipy=1.18.1
  - tqdm=4.70.1
  - vtk=9.4.2
  # testing / development (requirements-dev.txt)
  - pytest=9.1.1
  - pytest-cov=7.1.0
  - ruff=0.17.0
  - pip:
      - pyvista-gridder==0.6.0
# Ignore packages in the per-user site (e.g. those installed with `pip --user`),
# which would otherwise shadow the versions installed in this environment.
variables:
  PYTHONNOUSERSITE: "1"
